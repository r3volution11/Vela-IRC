name: Theme submission
description: Propose a theme for Vela's built-in collection.
labels: [theme]
body:
  - type: input
    id: name
    attributes:
      label: Theme name
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Type
      options: [dark, light]
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Origin and license
      description: Is this an original design or a port? If a port, link the original and state its license.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Please include the Classic, Modern grouped and Compact columns layouts.
    validations:
      required: true
  - type: textarea
    id: json
    attributes:
      label: Theme JSON
      render: json
