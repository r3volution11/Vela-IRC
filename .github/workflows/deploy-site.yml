name: Deploy Website

# Builds velairc.app (website/, VitePress) and publishes it with GitHub Pages.
# The settings, preset, theme-token and theme-gallery references are generated
# from the app's sources at build time, so changes to those files redeploy too.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'CHANGELOG.md'
      - 'docs/**'
      - 'Packages/VelaKit/Sources/VelaStore/SettingKeys.swift'
      - 'Packages/VelaKit/Sources/VelaStore/NavigationSettings.swift'
      - 'Packages/VelaKit/Sources/VelaTheme/BuiltInThemes/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling one
# that's halfway out.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history, for each page's "Updated" date

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      # The analytics rules: who is asked before measuring, which links count.
      - name: Test
        run: npm test

      # Generates the reference partials, then builds. VitePress fails the
      # build on any dead link.
      - name: Build
        run: npm run docs:build

      # Every page keeps its canonical URL, social tags and schema.org data;
      # the sitemap, CNAME and robots.txt are in place.
      - name: Check SEO and structured data
        run: npm run docs:check

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
