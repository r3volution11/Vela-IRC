name: CI

on:
  push:
    branches: [main, next]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      # The Alfred workflow the app bundles must be the one its record
      # describes (scripts/update-alfred-workflow.sh writes both).
      - name: Bundled Alfred workflow
        run: scripts/update-alfred-workflow.sh --check

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: Packages/VelaKit/.build
          key: spm-${{ runner.os }}-${{ hashFiles('Packages/VelaKit/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Package tests
        run: swift test --package-path Packages/VelaKit

      - name: Build app
        run: |
          xcodebuild \
            -project Vela.xcodeproj \
            -scheme Vela \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
